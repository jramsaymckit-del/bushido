<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- /v2/ AFTER THE CUTOVER. While BUSHIDO 2.0 was being built it was served at /v2/
     behind a gate that let in one account. Once 2.0 is the app at /app/ for everyone,
     /v2/ would be a second copy of the same client, and a second client writing the
     same record is the exact shape of the July incident. This page replaces it with a
     pure redirect, so the link that was shared while it was being built still works.
     It contains no cloud code of any kind and cannot read or write anyone's plan. -->
<meta http-equiv="refresh" content="0; url=../app/">
<title>BUSHIDO, moved to /app/</title>
<style>
  html,body{height:100%}
  body{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:'Noto Serif JP',serif;text-align:center;padding:40px 24px;color:#2b2622;background:#f4efe6}
  .mark{font-size:44px;color:#cc3529;margin-bottom:16px}
  .msg{font-size:15px;line-height:1.7;max-width:320px}
  a{color:#cc3529}
</style>
<script>
  // Pure redirect: carry any query or hash across to the app, then leave.
  // No sign-in, no storage, no cloud: this page cannot touch your data.
  location.replace('../app/' + location.search + location.hash);
</script>
</head>
<body>
  <div class="mark">武士道</div>
  <div class="msg">BUSHIDO 2.0 is now the app itself.<br>Taking you to <a href="../app/">your dashboard</a>.</div>
</body>
</html>
